<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Reset Password — MockFolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/css/style.css"/>
</head>
<body>
<nav>
  <a class="nav-logo" href="/">Mock<span>Folio</span></a>
  <div class="nav-links">
    <a href="/login" class="btn btn-secondary" style="padding:.4rem .9rem;font-size:.85rem;">Log In</a>
  </div>
</nav>

<div class="page-wrap" style="padding-top:80px;">
  <div class="auth-box">

    <div id="formView">
      <h2>Set a new password</h2>
      <p class="sub">Choose something you'll remember.</p>

      <div class="form-group">
        <label>New password</label>
        <input type="password" id="pw1" placeholder="At least 6 characters" autocomplete="new-password"/>
      </div>
      <div class="form-group">
        <label>Confirm password</label>
        <input type="password" id="pw2" placeholder="Repeat password" autocomplete="new-password"/>
      </div>

      <div class="auth-error" id="errMsg" style="display:none;"></div>

      <button class="btn btn-primary" onclick="doReset()" id="resetBtn">Set New Password</button>
    </div>

    <div id="successView" style="display:none;text-align:center;">
      <div style="font-size:2.5rem;margin-bottom:.75rem;">✅</div>
      <h2>Password updated!</h2>
      <p class="sub">You can now log in with your new password.</p>
      <a href="/login" class="btn btn-primary" style="display:block;margin-top:1.25rem;">Go to Login</a>
    </div>

  </div>
</div>

<script>
const TOKEN = "{{ token }}";

async function doReset() {
  const pw1   = document.getElementById('pw1').value;
  const pw2   = document.getElementById('pw2').value;
  const errEl = document.getElementById('errMsg');
  const btn   = document.getElementById('resetBtn');
  errEl.style.display = 'none';

  if (!pw1 || pw1.length < 6) {
    errEl.textContent = 'Password must be at least 6 characters.';
    errEl.style.display = 'block'; return;
  }
  if (pw1 !== pw2) {
    errEl.textContent = 'Passwords do not match.';
    errEl.style.display = 'block'; return;
  }

  btn.disabled    = true;
  btn.textContent = 'Saving…';

  try {
    const res  = await fetch('/api/reset-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({token: TOKEN, password: pw1})
    });
    const data = await res.json();
    if (data.ok) {
      document.getElementById('formView').style.display    = 'none';
      document.getElementById('successView').style.display = 'block';
    } else {
      errEl.textContent = data.error || 'Reset failed — try requesting a new link.';
      errEl.style.display = 'block';
      btn.disabled    = false;
      btn.textContent = 'Set New Password';
    }
  } catch(e) {
    errEl.textContent = 'Request failed — try again.';
    errEl.style.display = 'block';
    btn.disabled    = false;
    btn.textContent = 'Set New Password';
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') doReset(); });
</script>
  <script src="/static/js/theme.js"></script>
</body>
</html>
