<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — MockFolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
<nav>
  <a class="nav-logo" href="/">Mock<span>Folio</span></a>
  <div class="nav-links">
    <a href="/login" class="btn btn-secondary">Log In</a>
  </div>
</nav>

<div class="page-wrap" style="padding-top:80px;">
  <div class="auth-box">
    <h2>Start Trading Today</h2>
    <p class="sub">Get your free $50,000 paper account instantly</p>

    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="tradername" autocomplete="username" />
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Min 6 characters" autocomplete="new-password" />
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="password2" placeholder="Repeat password" autocomplete="new-password" />
    </div>

    <div class="auth-error" id="authError"></div>

    <button class="btn btn-primary" onclick="doRegister()">Create Free Account →</button>

    <div style="text-align:center;font-size:.75rem;color:var(--muted);margin-top:.75rem;">
      By signing up you agree to our Terms of Service. Paper trading only — no real money.
    </div>

    <div class="auth-switch">
      Already have an account? <a href="/login">Log in</a>
    </div>
  </div>
</div>

<script>
async function doRegister() {
  const username = document.getElementById('username').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;
  const errEl = document.getElementById('authError');
  errEl.style.display = 'none';

  if (!username || !email || !password) {
    errEl.textContent = 'All fields are required.';
    errEl.style.display = 'block';
    return;
  }
  if (password !== password2) {
    errEl.textContent = 'Passwords do not match.';
    errEl.style.display = 'block';
    return;
  }
  if (password.length < 6) {
    errEl.textContent = 'Password must be at least 6 characters.';
    errEl.style.display = 'block';
    return;
  }

  const res = await fetch('/register', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ username, email, password })
  });
  const data = await res.json();
  if (data.ok) {
    window.location.href = data.redirect;
  } else {
    errEl.textContent = data.error || 'Registration failed.';
    errEl.style.display = 'block';
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });
</script>
  <script src="/static/js/theme.js"></script>
</body>
</html>
