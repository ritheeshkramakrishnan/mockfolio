<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — MockFolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
<nav>
  <a class="nav-logo" href="/">Mock<span>Folio</span></a>
  <div class="nav-links">
    <a href="/register" class="btn btn-primary">Create Account</a>
  </div>
</nav>

<div class="page-wrap" style="padding-top:80px;">
  <div class="auth-box">
    <h2>Welcome back </h2>
    <p class="sub">Log in to your paper trading account</p>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
    </div>

    <div class="auth-error" id="authError"></div>

    <button class="btn btn-primary" onclick="doLogin()">Log In</button>

    <div class="auth-switch">
      Don't have an account? <a href="/register">Sign up free</a>
    </div>
    <div style="text-align:center;margin-top:.75rem;">
      <a href="/forgot-password" style="font-size:.82rem;color:var(--muted);text-decoration:none;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--muted)'">Forgot your password?</a>
    </div>
  </div>
</div>

<script>
async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('authError');
  errEl.style.display = 'none';

  if (!email || !password) {
    errEl.textContent = 'Please enter email and password.';
    errEl.style.display = 'block';
    return;
  }

  const res = await fetch('/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ email, password })
  });
  const data = await res.json();
  if (data.ok) {
    window.location.href = data.redirect;
  } else {
    errEl.textContent = data.error || 'Login failed.';
    errEl.style.display = 'block';
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
  <script src="/static/js/theme.js"></script>
</body>
</html>
