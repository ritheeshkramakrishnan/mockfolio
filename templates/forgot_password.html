<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Forgot Password — MockFolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/css/style.css"/>
</head>
<body>
<nav>
  <a class="nav-logo" href="/">Mock<span>Folio</span></a>
  <div class="nav-links">
    <a href="/login" class="btn btn-secondary" style="padding:.4rem .9rem;font-size:.85rem;">Log In</a>
  </div>
</nav>

<div class="page-wrap" style="padding-top:80px;">
  <div class="auth-box">

    <!-- Step 1: enter email -->
    <div id="step1">
      <h2>Forgot your password?</h2>
      <p class="sub">Enter your email and we'll give you a reset link.</p>

      <div class="form-group">
        <label>Email address</label>
        <input type="email" id="emailInput" placeholder="you@example.com" autocomplete="email"/>
      </div>

      <div class="auth-error" id="errMsg" style="display:none;"></div>

      <button class="btn btn-primary" onclick="requestReset()" id="submitBtn">Send Reset Link</button>

      <div class="auth-switch" style="margin-top:1rem;">
        Remembered it? <a href="/login">Back to login</a>
      </div>
    </div>

    <!-- Step 2: show result -->
    <div id="step2" style="display:none;">
      
      <h2 style="text-align:center;">Reset link ready</h2>
      <p class="sub" id="resultMsg" style="text-align:center;"></p>

      <!-- Shown when no email is configured -->
      <div id="linkBox" style="display:none;margin:1.25rem 0;">
        <div style="font-size:.78rem;color:var(--muted);margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.05em;">Your reset link</div>
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.75rem 1rem;word-break:break-all;font-size:.82rem;font-family:monospace;color:var(--text);" id="resetLinkText"></div>
        <button onclick="copyLink()" class="btn btn-secondary" style="width:100%;margin-top:.6rem;font-size:.85rem;">Copy Link</button>
        <div id="copiedMsg" style="display:none;text-align:center;font-size:.78rem;color:var(--accent);margin-top:.4rem;">✓ Copied to clipboard</div>
      </div>

      <div style="margin-top:.5rem;">
        <a href="/login" class="btn btn-primary" style="display:block;text-align:center;">Back to Login</a>
      </div>
    </div>

  </div>
</div>

<script>
let _resetUrl = '';

async function requestReset() {
  const email   = document.getElementById('emailInput').value.trim();
  const errEl   = document.getElementById('errMsg');
  const btn     = document.getElementById('submitBtn');
  errEl.style.display = 'none';

  if (!email) {
    errEl.textContent = 'Please enter your email address.';
    errEl.style.display = 'block';
    return;
  }

  btn.disabled    = true;
  btn.textContent = 'Generating link…';

  try {
    const res  = await fetch('/forgot-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email})
    });
    const data = await res.json();

    if (!data.ok) {
      errEl.textContent = data.error || 'Something went wrong.';
      errEl.style.display = 'block';
      btn.disabled    = false;
      btn.textContent = 'Send Reset Link';
      return;
    }

    // Show step 2
    document.getElementById('step1').style.display = 'none';
    document.getElementById('step2').style.display = 'block';
    document.getElementById('resultMsg').textContent = data.message;

    if (!data.emailed && data.reset_url) {
      _resetUrl = data.reset_url;
      document.getElementById('resetLinkText').textContent = data.reset_url;
      document.getElementById('linkBox').style.display = 'block';
    }

  } catch(e) {
    errEl.textContent = 'Request failed — try again.';
    errEl.style.display = 'block';
    btn.disabled    = false;
    btn.textContent = 'Send Reset Link';
  }
}

function copyLink() {
  navigator.clipboard.writeText(_resetUrl).then(() => {
    document.getElementById('copiedMsg').style.display = 'block';
    setTimeout(() => { document.getElementById('copiedMsg').style.display = 'none'; }, 2000);
  });
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') requestReset(); });
</script>
  <script src="/static/js/theme.js"></script>
</body>
</html>
