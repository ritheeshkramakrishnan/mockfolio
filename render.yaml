services:
  - type: web
    name: mockfolio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mockfolio-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: TWELVEDATA_API_KEY
        sync: false

databases:
  - name: mockfolio-db
    plan: free
